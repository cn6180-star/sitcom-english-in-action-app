<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sitcom English">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Global navigation"></aside>

        <section class="loading-card">Loading data…</section>

  </div>
  <nav id="bottomNav" class="bottom-nav" aria-label="Global navigation"></nav>

  <script src="js/dialogue-match-hints.js?v=1.1" defer></script>
